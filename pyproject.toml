[project]
name = "elastic_drafter"
version = "0.1.0"
description = "One parallel drafter, many ranks: acceptance-weighted capacity for speculative decoding"
requires-python = ">=3.12,<3.13"
dependencies = [
  "torch==2.14.1",
  "transformers==5.20.1",
  "accelerate==1.15.0",
  "datasets==5.1.0",
  "numpy==2.5.4",
  "scipy==1.18.1",
  "pyyaml==6.0.3",
  "tqdm==4.70.1",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
